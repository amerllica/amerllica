<svg xmlns="http://www.w3.org/2000/svg" width="860" height="334" viewBox="0 0 860 334" role="img" aria-label="Terminal: whoami prints Amer Lotfi Orimi, Senior Frontend Engineer">
  <style>
    :root { --bg:#1c1c1c; --bar:#262626; --line:#2f2f2f; --fg:#e6ffe9; --prompt:#00ff66; --title:#00ff66; --accent:#00ffb3; --muted:#8a9a8f; }
