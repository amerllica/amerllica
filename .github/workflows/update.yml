name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render terminal
        run: node scripts/terminal-svg.mjs

      - name: Refresh articles and Stack Overflow
        run: node scripts/update-readme.mjs

      - name: Draw contribution snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=#0b7a3e
            assets/snake-dark.svg?palette=github-dark&color_snake=#00ff66&color_dots=#1c1c1c,#0e4429,#006d32,#26a641,#00ff66

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --staged --quiet || git commit -m "chore: refresh profile"
          git push
